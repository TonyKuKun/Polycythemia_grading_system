<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Vertical flowchart of the cell detection pipeline: inpaint annotation overlays, LAB B-channel threshold, channel mask plus morphology, floodfill interior holes, connected components area filter, merge motion-blur fragments, adaptive shape filter, watershed split with non-max suppression, then output a list of cells with bounding box, centroid, and shape metrics.</desc>

